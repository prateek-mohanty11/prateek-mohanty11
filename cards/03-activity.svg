<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="360" viewBox="0 0 960 360" role="img" aria-label="GitHub contribution activity">
    <title>GitHub contribution activity</title><defs><linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a855f7"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
    <linearGradient id="shine"><stop stop-color="#a855f7" stop-opacity="0"/><stop offset=".5" stop-color="#c4b5fd"/><stop offset="1" stop-color="#a855f7" stop-opacity="0"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="26"/></filter><style>
    text{font-family:ProfileSans, Inter, ui-sans-serif, system-ui, sans-serif}.title{fill:#f5f3ff;font-size:31px;font-weight:750;letter-spacing:-.8px}.sub{fill:#a6a0bd;font-size:15px}
    .label{fill:#a6a0bd;font-size:12px;font-weight:650;letter-spacing:1.5px}.metric{fill:#f5f3ff;font-size:29px;font-weight:800}
    .small{fill:#a6a0bd;font-size:13px}.panel{fill:#11111f;stroke:#30264a;stroke-width:1.2}
      .enter{opacity:0;transform:translateY(16px);animation:rise .8s cubic-bezier(.2,.75,.2,1) both}
      .pulse{animation:pulse 4s ease-in-out infinite}
      .draw{stroke-dasharray:1100;stroke-dashoffset:1100;animation:draw 1.8s ease-out forwards}
      .float{animation:float 5s ease-in-out infinite}
      @keyframes rise{to{opacity:1;transform:translateY(0)}}
      @keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
      @keyframes draw{to{stroke-dashoffset:0}}
      @keyframes float{50%{transform:translateY(-5px)}}
      @media(prefers-reduced-motion:reduce){
        *,*::before,*::after{animation:none!important;transition:none!important}
        .enter{opacity:1!important;transform:none!important}
        .pulse,.float{animation:none!important;transform:none!important}
        animate,animateTransform,animateMotion{display:none!important}
        .shine-anim{display:none!important}
      }</style></defs>
    <rect width="960" height="360" rx="26" fill="#090914"/><circle cx="825" cy="38" r="125" fill="#a855f7" opacity=".12" filter="url(#blur)"/>
    <rect x="1" y="1" width="958" height="358" rx="25" fill="none" stroke="#30264a"/><rect x="24" y="24" width="912" height="312" rx="22" class="panel"/><g class="enter" style="animation-delay:.9s"><text x="52" y="65" class="label">CONTRIBUTION PULSE</text><text x="52" y="101" class="title">Consistency compounds.</text></g><g class="enter" style="animation-delay:1.05s"><text x="52" y="142" class="label">CURRENT STREAK</text><text x="52" y="180" class="metric">0 days</text></g><g class="enter" style="animation-delay:1.17s"><text x="242" y="142" class="label">ACTIVE DAYS</text><text x="242" y="180" class="metric">84</text></g><g class="enter" style="animation-delay:1.29s"><text x="432" y="142" class="label">LONGEST STREAK</text><text x="432" y="180" class="metric">36 days</text></g><text x="52" y="224" class="label">MONTHLY CONTRIBUTIONS · LAST 12 MONTHS</text><g class="enter" style="animation-delay:1.45s"><rect x="54" y="297" width="45" height="3" rx="7" fill="url(#brand)"/><text x="76" y="320" text-anchor="middle" class="small">Dec</text></g><g class="enter" style="animation-delay:1.505s"><rect x="123" y="297" width="45" height="3" rx="7" fill="url(#brand)"/><text x="145" y="320" text-anchor="middle" class="small">Jan</text></g><g class="enter" style="animation-delay:1.56s"><rect x="192" y="297" width="45" height="3" rx="7" fill="url(#brand)"/><text x="214" y="320" text-anchor="middle" class="small">Feb</text></g><g class="enter" style="animation-delay:1.615s"><rect x="261" y="297" width="45" height="3" rx="7" fill="url(#brand)"/><text x="283" y="320" text-anchor="middle" class="small">Mar</text></g><g class="enter" style="animation-delay:1.67s"><rect x="330" y="297" width="45" height="3" rx="7" fill="url(#brand)"/><text x="352" y="320" text-anchor="middle" class="small">Apr</text></g><g class="enter" style="animation-delay:1.725s"><rect x="399" y="297" width="45" height="3" rx="7" fill="url(#brand)"/><text x="421" y="320" text-anchor="middle" class="small">May</text></g><g class="enter" style="animation-delay:1.78s"><rect x="468" y="297" width="45" height="3" rx="7" fill="url(#brand)"/><text x="490" y="320" text-anchor="middle" class="small">Jun</text></g><g class="enter" style="animation-delay:1.835s"><rect x="537" y="256" width="45" height="44" rx="7" fill="url(#brand)"/><text x="559" y="320" text-anchor="middle" class="small">Jul</text></g><g class="enter" style="animation-delay:1.89s"><rect x="606" y="245" width="45" height="55" rx="7" fill="url(#brand)"/><text x="628" y="320" text-anchor="middle" class="small">Aug</text></g><g class="enter" style="animation-delay:1.9449999999999998s"><rect x="675" y="281" width="45" height="19" rx="7" fill="url(#brand)"/><text x="697" y="320" text-anchor="middle" class="small">Sep</text></g><g class="enter" style="animation-delay:2.0s"><rect x="744" y="291" width="45" height="9" rx="7" fill="url(#brand)"/><text x="766" y="320" text-anchor="middle" class="small">Oct</text></g><g class="enter" style="animation-delay:2.0549999999999997s"><rect x="813" y="297" width="45" height="3" rx="7" fill="url(#brand)"/><text x="835" y="320" text-anchor="middle" class="small">Nov</text></g><g class="enter" style="animation-delay:2.2s"><text x="745" y="142" class="label">BUSIEST WEEKDAY</text><text x="745" y="180" fill="#c4b5fd" font-size="24" font-weight="800">Sunday</text><text x="745" y="204" class="small">Peak date: 12 Jul 2026</text><text x="745" y="226" class="small">46 contributions</text></g><rect class="shine-anim" x="24" y="24" width="912" height="2" fill="url(#shine)"><animate attributeName="x" values="-920;960" dur="5s" repeatCount="indefinite"/></rect></svg>
