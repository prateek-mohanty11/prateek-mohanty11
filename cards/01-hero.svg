<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="280" viewBox="0 0 960 280" role="img" aria-label="Prateek Mohanty profile introduction">
    <title>Prateek Mohanty profile introduction</title><defs><linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a855f7"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
    <linearGradient id="shine"><stop stop-color="#a855f7" stop-opacity="0"/><stop offset=".5" stop-color="#c4b5fd"/><stop offset="1" stop-color="#a855f7" stop-opacity="0"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="26"/></filter><style>
    text{font-family:ProfileSans, Inter, ui-sans-serif, system-ui, sans-serif}.title{fill:#f5f3ff;font-size:31px;font-weight:750;letter-spacing:-.8px}.sub{fill:#a6a0bd;font-size:15px}
    .label{fill:#a6a0bd;font-size:12px;font-weight:650;letter-spacing:1.5px}.metric{fill:#f5f3ff;font-size:29px;font-weight:800}
    .small{fill:#a6a0bd;font-size:13px}.panel{fill:#11111f;stroke:#30264a;stroke-width:1.2}
      .enter{opacity:0;transform:translateY(16px);animation:rise .8s cubic-bezier(.2,.75,.2,1) both}
      .pulse{animation:pulse 4s ease-in-out infinite}
      .draw{stroke-dasharray:1100;stroke-dashoffset:1100;animation:draw 1.8s ease-out forwards}
      .float{animation:float 5s ease-in-out infinite}
      @keyframes rise{to{opacity:1;transform:translateY(0)}}
      @keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
      @keyframes draw{to{stroke-dashoffset:0}}
      @keyframes float{50%{transform:translateY(-5px)}}
      @media(prefers-reduced-motion:reduce){
        *,*::before,*::after{animation:none!important;transition:none!important}
        .enter{opacity:1!important;transform:none!important}
        .pulse,.float{animation:none!important;transform:none!important}
        animate,animateTransform,animateMotion{display:none!important}
        .shine-anim{display:none!important}
      }</style></defs>
    <rect width="960" height="280" rx="26" fill="#090914"/><circle cx="825" cy="38" r="125" fill="#a855f7" opacity=".12" filter="url(#blur)"/>
    <rect x="1" y="1" width="958" height="278" rx="25" fill="none" stroke="#30264a"/><rect x="24" y="24" width="912" height="232" rx="22" class="panel"/><rect x="24" y="24" width="5" height="232" rx="2" fill="url(#brand)"/>
    <g class="enter" style="animation-delay:0s"><text x="64" y="72" class="label">HELLO, I'M</text><text x="64" y="128" class="title" font-size="48">Prateek Mohanty</text>
    <text x="64" y="164" class="sub">Engineering student • Developer • AI/ML enthusiast</text><rect x="64" y="193" width="150" height="38" rx="19" fill="url(#brand)"/>
    <text x="139" y="217" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">GITHUB PROFILE ↗</text>
    <a href="https://github.com/prateek-mohanty11" xlink:href="https://github.com/prateek-mohanty11" target="_blank"><rect x="64" y="193" width="150" height="38" rx="19" fill="transparent"/></a>
    <a href="https://prateek-mohanty.vercel.app" xlink:href="https://prateek-mohanty.vercel.app" target="_blank"><text x="235" y="217" fill="#c4b5fd" font-size="13" font-weight="700">PORTFOLIO ↗</text></a></g>
    <circle cx="824" cy="137" r="82" fill="#a855f7" opacity=".13" class="pulse"/><g class="enter float" style="animation-delay:.15s"><circle cx="824" cy="137" r="69" fill="url(#brand)"/><text x="824" y="154" text-anchor="middle" fill="#fff" font-size="46" font-weight="800">PM</text></g></svg>
